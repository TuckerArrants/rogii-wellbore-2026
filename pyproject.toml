[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rogii-wellbore"
version = "1.0.0"
description = "ROGII 2026 wellbore geology prediction: two-stage U-Net pipeline (26th place)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "torch>=2.1",
    "segmentation_models_pytorch==0.5.0",
    "timm==1.0.27",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
