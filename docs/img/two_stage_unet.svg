<line x1="24" y1="306" x2="976" y2="306" class="rule"/>
<text x="24" y="340" class="step kt">TRAINING</text>
<text x="124" y="340" class="ink">Learn on made-up wells first, where the answer is always known.</text>
<rect x="24" y="364" width="286" height="120" rx="10" class="box"/>
<text x="167" y="392" text-anchor="middle" class="h ink">25,000 synthetic wells</text>
<text x="167" y="416" text-anchor="middle" class="s mut">per fold, from the reference logs:</text>
<text x="167" y="436" text-anchor="middle" class="s mut">faults, dip breaks, repeats</text>
<text x="167" y="456" text-anchor="middle" class="s mut">5 epochs</text>
