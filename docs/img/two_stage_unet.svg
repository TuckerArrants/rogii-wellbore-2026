<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 572" role="img" aria-labelledby="t d">
<title id="t">The two-stage U-Net and how it is trained</title>
<desc id="d">Top: the five-channel image goes into the stage 1 U-Net. Both U-Nets have EfficientNet encoders that start from ImageNet weights. Stage 1 gives, for every column, a probability for every row. These are softened (temperature 1.5) and added to the image as a sixth channel. Stage 2, a second U-Net, reads all six and gives sharper probabilities. Its output is fed back into itself two more times (three rounds; the L2 model runs one). The prediction in each column is the probability-weighted average row, turned back into depth in feet. Bottom: each model first learns on 25,000 synthetic wells per fold for 5 epochs, then on about 620 real wells for up to 35 epochs. Four models of different sizes, each trained 35 times (5 folds by 7 seeds), are averaged with equal weights.</desc>
